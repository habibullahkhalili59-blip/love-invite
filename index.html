<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دعوت ویژه برای معصومه ❤️</title>

<style>
body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#050505,#5b0025);
display:flex;
justify-content:center;
align-items:center;
font-family:tahoma;
color:white;
overflow:hidden;
}

.card{
width:90%;
max-width:450px;
padding:35px;
background:#ffffff18;
backdrop-filter:blur(15px);
border-radius:30px;
text-align:center;
box-shadow:0 0 40px #ff0055;
}

h1{
color:#ffd700;
font-size:35px;
}

p{
font-size:20px;
line-height:2;
}

button{
padding:15px 35px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:10px;
}

.yes{
background:#e91e63;
color:white;
}

.no{
background:#555;
color:white;
position:relative;
}

input{
padding:12px;
margin:8px;
border-radius:20px;
border:none;
width:80%;
}

.food{
display:inline-block;
background:#ffffff22;
padding:10px;
margin:5px;
border-radius:20px;
}

.hide{
display:none;
}

.heart{
font-size:60px;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.2);}
}

</style>

</head>

<body>


<form action="https://formspree.io/f/mbdnbraa" method="POST">


<div class="card" id="p1">

<div class="heart">❤️</div>

<h1>معصومه</h1>

<p>
یک سوال خاص از تو دارم 🌹<br>
می‌خایی باهم یک خاطره قشنگ بسازیم؟
</p>

<input type="hidden" name="answer" value="قبول ملاقات ❤️">

<button type="button" class="yes" onclick="showPage(2)">
❤️ بله
</button>

<button type="button" class="no" id="no" onmouseover="moveNo()">
🤍 نخیر
</button>

</div>



<div class="card hide" id="p2">

<h1>انتخاب زمان 📅</h1>

<input type="date" name="date" required>

<input type="time" name="time" required>

<br>

<button type="button" class="yes" onclick="showPage(3)">
ادامه ❤️
</button>

</div>




<div class="card hide" id="p3">

<h1>انتخاب خوراکی 🍽️</h1>

<p>چی دوست داری بخوریم؟</p>


<label class="food">
<input type="radio" name="food" value="جوس" required>
🥤 جوس
</label>

<label class="food">
<input type="radio" name="food" value="پیتزا">
🍕 پیتزا
</label>

<label class="food">
<input type="radio" name="food" value="آیسکریم">
🍦 آیسکریم
</label>

<label class="food">
<input type="radio" name="food" value="کباب">
🥩 کباب
</label>

<label class="food">
<input type="radio" name="food" value="قابلی">
🍚 قابلی
</label>

<label class="food">
<input type="radio" name="food" value="منتو">
🥟 منتو
</label>

<label class="food">
<input type="radio" name="food" value="آشک">
🥘 آشک
</label>

<br>

<button type="submit" class="yes">
ثبت قرار ❤️
</button>

</div>



</form>



<script>

function showPage(number){

document.querySelectorAll(".card").forEach(function(e){
e.classList.add("hide");
});

document.getElementById("p"+number).classList.remove("hide");

}


function moveNo(){

let no=document.getElementById("no");

no.style.position="absolute";
no.style.left=Math.random()*250+"px";
no.style.top=Math.random()*300+"px";

}

</script>


</body>
</html>
