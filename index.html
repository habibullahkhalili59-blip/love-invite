<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>برای معصومه ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Tahoma;
    overflow:hidden;
}

.card{
    background:white;
    width:80%;
    max-width:450px;
    padding:35px;
    text-align:center;
    border-radius:25px;
    box-shadow:0 10px 30px #888;
}

h1{
    color:#e91e63;
    font-size:40px;
}

p{
    font-size:20px;
    line-height:2;
    color:#444;
}

.heart{
    font-size:70px;
    animation:beat 1s infinite;
}

button{
    background:#e91e63;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
}

@keyframes beat{
    50%{transform:scale(1.2);}
}

.fall{
    position:absolute;
    top:-20px;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}
</style>

</head>

<body>

<div class="card">

<div class="heart">❤️</div>

<h1>معصومه</h1>

<p>
گاهی یک نفر وارد زندگی آدم می‌شود
که بودنش آرامش می‌دهد...
<br><br>
معصومه عزیز، تو برای من فقط یک اسم نیستی،
تو یک حس قشنگی هستی که باعث می‌شود لبخند بزنم.
<br><br>
امیدوارم همیشه خوشحال، موفق و پر از آرامش باشی.
❤️
</p>

<button onclick="alert('همیشه به یادت هستم ❤️')">
کلیک کن
</button>

</div>


<script>
for(let i=0;i<30;i++){
 let h=document.createElement("div");
 h.className="fall";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"%";
 h.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(h);
}
</script>

</body>
</html>
